name: Stage npm release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: daykeeper-npm-production
    env:
      DAYKEEPER_RELEASE_APPROVED: ${{ vars.DAYKEEPER_RELEASE_APPROVED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.8.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@11.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/verify-release.mjs
      - name: Stage package for npm review
        run: npm stage publish --access public --tag "${{ github.event.release.prerelease && 'next' || 'latest' }}"
